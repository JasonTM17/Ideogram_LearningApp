name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Validate pushed commit messages
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git rev-list --reverse "$HEAD_SHA" | while read -r commit_sha; do
              git show -s --format=%B "$commit_sha" | pnpm exec commitlint --verbose
            done
          else
            pnpm exec commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
          fi

      - name: Validate public and server environment boundaries
        run: pnpm check:env

      - name: Check formatting
        run: pnpm format:check

      - name: Lint workspace
        run: pnpm lint

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run unit and contract tests
        run: pnpm test

      - name: Build web, mobile export and worker
        run: pnpm build

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  database:
    name: Database mutation regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.0.9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Load local database test URL
        shell: bash
        run: |
          pnpm exec supabase status -o json > supabase-status.json
          database_url="$(node -e "const value = JSON.parse(require('node:fs').readFileSync('supabase-status.json', 'utf8')).DB_URL; if (!value) throw new Error('Supabase status did not return DB_URL.'); process.stdout.write(value);")"
          echo "::add-mask::$database_url"
          echo "SUPABASE_DB_URL=$database_url" >> "$GITHUB_ENV"
          rm supabase-status.json

      - name: Run pgTAP learning access-boundary tests
        run: pnpm exec supabase test db supabase/tests/learning_rls_test.sql

      - name: Run pgTAP learner write tests
        run: pnpm exec supabase test db supabase/tests/review_idempotency_test.sql

      - name: Run pgTAP placement lifecycle tests
        run: pnpm exec supabase test db supabase/tests/placement_lifecycle_test.sql

      - name: Run pgTAP tutor ledger tests
        run: pnpm exec supabase test db supabase/tests/ai_tutor_turn_ledger_test.sql

      - name: Run review authorization lock-order regression
        run: pnpm test:db:review-lock-order

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop
