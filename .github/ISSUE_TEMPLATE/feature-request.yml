name: Feature request
description: Propose a bounded learner, maintainer, or platform improvement.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and acceptance criteria
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Learning experience,
          Web,
          Expo mobile,
          AI tutor,
          Offline sync,
          Content or media,
          Operations,
          Documentation,
        ]
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Security, privacy, rights, or accessibility constraints
