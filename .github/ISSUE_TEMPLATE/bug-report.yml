name: Bug report
description: Report reproducible incorrect behavior without secrets or personal data.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use the private Security tab flow.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps using synthetic data only.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Web, Expo mobile, Worker, Database, Content, CI or package, Documentation]
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
      placeholder: Full commit SHA or package tag
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove tokens, database URLs, learner data, and other secrets.
