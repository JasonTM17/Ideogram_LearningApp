<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Ôn tập - Editorial Scholar</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#dce9ff",
                    "secondary": "#006a63",
                    "on-secondary-fixed-variant": "#00504a",
                    "on-error": "#ffffff",
                    "secondary-container": "#99efe5",
                    "secondary-fixed-dim": "#80d5cb",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed-variant": "#173bab",
                    "error-container": "#ffdad6",
                    "surface-bright": "#f8f9ff",
                    "surface-container-highest": "#d5e3fc",
                    "inverse-primary": "#b8c4ff",
                    "tertiary-fixed-dim": "#ffb59d",
                    "primary-container": "#1e40af",
                    "primary": "#00288e",
                    "outline": "#757684",
                    "on-tertiary-fixed-variant": "#832600",
                    "on-tertiary-container": "#ffa588",
                    "background": "#f8f9ff",
                    "on-secondary-fixed": "#00201d",
                    "error": "#ba1a1a",
                    "on-primary": "#ffffff",
                    "surface-variant": "#d5e3fc",
                    "on-surface": "#0d1c2e",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-container": "#a8b8ff",
                    "surface-dim": "#ccdbf3",
                    "outline-variant": "#c4c5d5",
                    "tertiary-container": "#8b2900",
                    "on-surface-variant": "#444653",
                    "on-primary-fixed": "#001453",
                    "inverse-surface": "#233144",
                    "tertiary": "#641b00",
                    "surface-container": "#e6eeff",
                    "primary-fixed-dim": "#b8c4ff",
                    "surface-container-low": "#eff4ff",
                    "tertiary-fixed": "#ffdbd0",
                    "surface": "#f8f9ff",
                    "on-background": "#0d1c2e",
                    "on-tertiary-fixed": "#390c00",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "surface-tint": "#3755c3",
                    "secondary-fixed": "#9cf2e8",
                    "primary-fixed": "#dde1ff",
                    "inverse-on-surface": "#eaf1ff",
                    "on-secondary-container": "#006f67"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px",
                    "2xl": "1rem",
                    "3xl": "1.5rem",
            },
            "spacing": {
                '44': '2.75rem',
                'safe-top': 'env(safe-area-inset-top)',
                'safe-bottom': 'env(safe-area-inset-bottom)',
            },
            "fontFamily": {
                    "headline": ["Be Vietnam Pro", "sans-serif"],
                    "display": ["Be Vietnam Pro", "sans-serif"],
                    "body": ["Be Vietnam Pro", "sans-serif"],
                    "label": ["Be Vietnam Pro", "sans-serif"],
                    "jp": ["Noto Sans JP", "sans-serif"]
            },
            "boxShadow": {
                'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                'card': '0 2px 10px rgba(0, 0, 0, 0.03)',
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* CJK-safe wrapping and furigana spacing */
        rt {
            font-size: 0.5em;
            color: theme('colors.on-surface-variant');
            user-select: none;
        }
        
        ruby {
            ruby-position: over;
        }
        
        .furigana-hidden rt {
            visibility: hidden;
        }

        /* Ensure smooth transitions */
        .reveal-transition {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        .hide-initial {
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
        }
        
        .show-reveal {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col pt-safe-top pb-safe-bottom antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Header / TopAppBar -->
<header class="flex flex-col w-full px-4 pt-4 pb-2 bg-background sticky top-0 z-10">
<div class="flex items-center justify-between w-full h-12">
<!-- Close Button -->
<button aria-label="Đóng phiên ôn tập" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-low active:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-2xl">close</span>
</button>
<!-- Progress Indicator -->
<div class="flex flex-col items-center flex-1 px-4">
<span class="font-label text-sm font-semibold text-on-surface mb-1">7 / 20</span>
<div class="w-full h-1.5 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-300" style="width: 35%;"></div>
</div>
</div>
<!-- Sync Status -->
<div aria-label="Đã đồng bộ" class="w-11 h-11 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-xl" title="Đã đồng bộ">cloud_done</span>
</div>
</div>
</header>
<!-- Main Review Canvas -->
<main class="flex-1 flex flex-col px-4 py-6 w-full max-w-md mx-auto relative h-full">
<!-- Prompt Card (Front of Flashcard) -->
<div class="bg-surface-container-lowest rounded-3xl p-8 shadow-card flex flex-col items-center justify-center flex-1 min-h-[300px] border border-surface-container-low mb-6 relative">
<!-- Furigana Toggle -->
<button class="absolute top-4 right-4 flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-low hover:bg-surface-container transition-colors border border-outline-variant/30 group" id="furiganaToggle">
<span class="material-symbols-outlined text-on-surface-variant text-sm group-hover:text-primary transition-colors">translate</span>
<span class="font-label text-xs font-medium text-on-surface-variant group-hover:text-primary transition-colors">Hiện Furigana</span>
</button>
<!-- Japanese Content -->
<div class="text-center w-full mt-4">
<p class="font-label text-xs font-semibold text-secondary uppercase tracking-widest mb-4">Câu ví dụ</p>
<div class="font-jp text-[2rem] leading-[1.6] text-on-surface font-medium furigana-hidden" id="jpContent">
<ruby>駅<rt>えき</rt></ruby>で<ruby>友<rt>とも</rt></ruby>だちを<ruby>待<rt>ま</rt></ruby>ちます
                </div>
</div>
<!-- Audio Controls -->
<div class="flex items-center gap-4 mt-10">
<button aria-label="Nghe lại audio" class="w-14 h-14 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center hover:opacity-90 active:scale-95 transition-all shadow-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<button class="px-4 h-10 rounded-full border border-outline-variant flex items-center gap-2 hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined text-sm">speed</span>
<span class="font-label text-sm font-medium">1.0x</span>
</button>
</div>
</div>
<!-- Reveal Area (Initially Hidden) -->
<div class="reveal-transition hide-initial flex flex-col gap-6 mb-8" id="revealArea">
<div class="bg-surface-bright rounded-2xl p-6 border border-surface-container-high text-center">
<p class="font-label text-xs font-semibold text-on-surface-variant uppercase tracking-widest mb-2">Ý nghĩa</p>
<p class="font-body text-lg text-on-surface">Chờ bạn ở nhà ga</p>
</div>
</div>
<!-- Action Area (Bottom) -->
<div class="mt-auto pt-4 pb-2 w-full">
<!-- Reveal Button (Shows before answer) -->
<button class="w-full h-14 rounded-xl bg-primary text-on-primary font-label text-base font-semibold shadow-soft hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="revealBtn">
                Hiển thị đáp án
            </button>
<!-- SRS Buttons (Shows after reveal) -->
<div class="reveal-transition hide-initial hidden w-full grid grid-cols-3 gap-3" id="srsControls">
<button class="flex flex-col items-center justify-center h-16 rounded-xl border border-error-container bg-surface hover:bg-error-container/20 transition-colors active:scale-95">
<span class="font-label text-sm font-semibold text-error mb-0.5">Khó</span>
<span class="font-label text-[10px] text-on-surface-variant">2 ngày</span>
</button>
<button class="flex flex-col items-center justify-center h-16 rounded-xl border border-secondary-container bg-surface hover:bg-secondary-container/20 transition-colors active:scale-95">
<span class="font-label text-sm font-semibold text-secondary mb-0.5">Được</span>
<span class="font-label text-[10px] text-on-surface-variant">4 ngày</span>
</button>
<button class="flex flex-col items-center justify-center h-16 rounded-xl border border-primary-container bg-surface hover:bg-primary-container/10 transition-colors active:scale-95">
<span class="font-label text-sm font-semibold text-primary mb-0.5">Dễ</span>
<span class="font-label text-[10px] text-on-surface-variant">7 ngày</span>
</button>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const furiganaToggle = document.getElementById('furiganaToggle');
            const jpContent = document.getElementById('jpContent');
            const toggleText = furiganaToggle.querySelector('span:nth-child(2)');
            
            const revealBtn = document.getElementById('revealBtn');
            const revealArea = document.getElementById('revealArea');
            const srsControls = document.getElementById('srsControls');

            // Furigana Toggle Logic
            let furiganaVisible = false;
            furiganaToggle.addEventListener('click', () => {
                furiganaVisible = !furiganaVisible;
                if (furiganaVisible) {
                    jpContent.classList.remove('furigana-hidden');
                    toggleText.textContent = 'Ẩn Furigana';
                    furiganaToggle.classList.add('bg-primary-container', 'border-primary-container');
                    furiganaToggle.classList.remove('bg-surface-container-low', 'border-outline-variant/30');
                    furiganaToggle.querySelectorAll('span').forEach(span => {
                        span.classList.remove('text-on-surface-variant', 'group-hover:text-primary');
                        span.classList.add('text-on-primary-container');
                    });
                } else {
                    jpContent.classList.add('furigana-hidden');
                    toggleText.textContent = 'Hiện Furigana';
                    furiganaToggle.classList.remove('bg-primary-container', 'border-primary-container');
                    furiganaToggle.classList.add('bg-surface-container-low', 'border-outline-variant/30');
                    furiganaToggle.querySelectorAll('span').forEach(span => {
                        span.classList.add('text-on-surface-variant', 'group-hover:text-primary');
                        span.classList.remove('text-on-primary-container');
                    });
                }
            });

            // Reveal Logic
            revealBtn.addEventListener('click', () => {
                // Hide reveal button
                revealBtn.classList.add('hidden');
                
                // Show reveal area (translation)
                revealArea.classList.remove('hide-initial');
                revealArea.classList.add('show-reveal');
                
                // Show SRS controls
                srsControls.classList.remove('hidden');
                // Small delay to allow display:flex to apply before animating opacity
                setTimeout(() => {
                    srsControls.classList.remove('hide-initial');
                    srsControls.classList.add('show-reveal');
                }, 10);
            });
        });
    </script>
</body></html>
