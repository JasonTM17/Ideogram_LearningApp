<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #faf9f4;
            color: #1b1c19;
            -webkit-font-smoothing: antialiased;
        }
        .paper-divider {
            height: 1px;
            background-color: #E0DDD5;
        }
        ruby {
            ruby-align: center;
            ruby-position: over;
        }
        rt {
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 0.4em;
            letter-spacing: 0.1em;
            color: #43474c;
            padding-bottom: 0.2em;
        }
        .option-tile:focus-within {
            border-color: #162839;
            background-color: #f5f4ef;
        }
        .transition-standard {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>

<body class="min-h-screen flex flex-col font-body-md selection:bg-secondary-fixed">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface flex items-center justify-between px-gutter h-touch-target-min w-full border-b border-outline-variant z-50">
<div class="flex items-center gap-4">
<button aria-label="Đóng" class="p-2 hover:bg-surface-container-high transition-colors active:scale-95 text-primary">
<span class="material-symbols-outlined">close</span>
</button>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant">BÀI 5: GIA ĐÌNH</span>
<div class="w-48 h-1 bg-surface-container-highest mt-1">
<div class="h-full bg-primary w-1/4"></div>
</div>
</div>
</div>
<div class="font-body-md text-body-md text-on-surface-variant">
            1 of 4
        </div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-padding py-section-gap">
<div class="max-w-[800px] w-full flex flex-col gap-section-gap">
<!-- Question Content -->
<section class="text-center flex flex-col gap-unit">
<div class="flex flex-col items-center gap-4 mb-2">
<ruby class="font-display-jp text-display-jp text-primary">
                        先生 <rt>せんせい</rt>
</ruby>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mt-4">
                    Giáo viên
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md mx-auto">
                    Chọn ý nghĩa chính xác của từ vựng trên để tiếp tục bài học.
                </p>
</section>
<!-- Multiple Choice Grid -->
<section aria-labelledby="question-heading" class="grid grid-cols-1 gap-4 w-full max-w-lg mx-auto" role="radiogroup">
<!-- Option 1 -->
<label class="option-tile transition-standard flex items-center p-container-padding border border-outline-variant cursor-pointer hover:bg-surface-container-low active:scale-[0.99] group">
<input class="sr-only peer" name="answer" type="radio" value="1"/>
<span class="w-8 h-8 flex items-center justify-center border border-outline text-label-caps font-label-caps peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary transition-colors">A</span>
<span class="ml-4 font-body-lg text-body-lg text-on-surface">Giáo viên</span>
<span class="ml-auto material-symbols-outlined opacity-0 peer-checked:opacity-100 text-primary">check_circle</span>
</label>
<!-- Option 2 -->
<label class="option-tile transition-standard flex items-center p-container-padding border border-outline-variant cursor-pointer hover:bg-surface-container-low active:scale-[0.99] group">
<input class="sr-only peer" name="answer" type="radio" value="2"/>
<span class="w-8 h-8 flex items-center justify-center border border-outline text-label-caps font-label-caps peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary transition-colors">B</span>
<span class="ml-4 font-body-lg text-body-lg text-on-surface">Sinh viên</span>
<span class="ml-auto material-symbols-outlined opacity-0 peer-checked:opacity-100 text-primary">check_circle</span>
</label>
<!-- Option 3 -->
<label class="option-tile transition-standard flex items-center p-container-padding border border-outline-variant cursor-pointer hover:bg-surface-container-low active:scale-[0.99] group">
<input class="sr-only peer" name="answer" type="radio" value="3"/>
<span class="w-8 h-8 flex items-center justify-center border border-outline text-label-caps font-label-caps peer-checked:bg-primary peer-checked:text-on-primary peer-checked:border-primary transition-colors">C</span>
<span class="ml-4 font-body-lg text-body-lg text-on-surface">Bác sĩ</span>
<span class="ml-auto material-symbols-outlined opacity-0 peer-checked:opacity-100 text-primary">check_circle</span>
</label>
</section>
</div>
</main>
<!-- Feedback Panel (Hidden by default, triggered by confirm) -->
<div class="fixed bottom-[72px] left-0 w-full transform translate-y-full transition-transform duration-300 ease-out z-40" id="feedback-panel">
<div class="max-w-[800px] mx-auto p-gutter bg-secondary-container border-t border-secondary text-on-secondary-container flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div>
<p class="font-body-md font-bold">Chính xác!</p>
<p class="text-sm opacity-90">Bạn đã nắm vững từ vựng này.</p>
</div>
</div>
<button class="p-2 hover:bg-black/5 rounded-full transition-colors" onclick="dismissFeedback()">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<!-- Footer -->
<footer class="fixed bottom-0 w-full bg-surface flex justify-center items-center px-container-padding py-unit h-[72px] pb-safe w-full border-t border-outline-variant z-50">
<div class="max-w-[800px] w-full flex justify-end">
<button class="bg-primary text-on-primary font-label-caps text-label-caps px-12 h-touch-target-min hover:opacity-90 active:scale-[0.98] transition-all duration-200" id="confirm-btn" onclick="handleConfirm()">
                XÁC NHẬN
            </button>
</div>
</footer>
<script>
        function handleConfirm() {
            const selected = document.querySelector('input[name="answer"]:checked');
            if (!selected) {
                // Inline shake or light visual hint if nothing selected
                const grid = document.querySelector('section.grid');
                grid.classList.add('animate-pulse');
                setTimeout(() => grid.classList.remove('animate-pulse'), 500);
                return;
            }

            const panel = document.getElementById('feedback-panel');
            const btn = document.getElementById('confirm-btn');

            if (selected.value === "1") {
                panel.classList.remove('translate-y-full');
                panel.querySelector('div > div').classList.remove('bg-error-container');
                panel.querySelector('div > div').classList.add('bg-secondary-container');
                btn.innerText = "TIẾP TỤC";
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-secondary');
            } else {
                panel.classList.remove('translate-y-full');
                const panelInner = panel.querySelector('.max-w-\\[800px\\]');
                panelInner.classList.remove('bg-secondary-container', 'border-secondary', 'text-on-secondary-container');
                panelInner.classList.add('bg-error-container', 'border-error', 'text-on-error-container');
                panelInner.querySelector('.material-symbols-outlined').innerText = 'error';
                panelInner.querySelector('.material-symbols-outlined').classList.replace('text-secondary', 'text-error');
                panelInner.querySelector('p.font-bold').innerText = 'Chưa đúng rồi';
                panelInner.querySelector('p.text-sm').innerText = 'Đáp án đúng là: Giáo viên';
            }
        }

        function dismissFeedback() {
            const panel = document.getElementById('feedback-panel');
            panel.classList.add('translate-y-full');
        }

        // Add visual feedback for keyboard users
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '3') {
                const inputs = document.querySelectorAll('input[name="answer"]');
                inputs[parseInt(e.key) - 1].checked = true;
            }
            if (e.key === 'Enter') {
                handleConfirm();
            }
        });
    </script>
</body></html>
