<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ideogram - Đăng nhập</title>

                    "on-background": "#261816",
                    "tertiary-container": "#007ea1",
                    "on-secondary-fixed": "#161f00",
                    "on-secondary-container": "#5a682f",
                    "on-surface": "#261816",
                    "on-primary": "#ffffff",

                    "inverse-surface": "#3d2d2a",

                    "on-tertiary-container": "#fbfdff",

                    "inverse-primary": "#ffb4a7",
                    "surface-tint": "#b12c1a",
                    "outline-variant": "#e2bfb8",
                    "tertiary": "#006480",
                    "on-tertiary-fixed-variant": "#004d63",
                    "on-primary-container": "#fffbff",
                    "on-secondary": "#ffffff",
                    "primary-fixed": "#ffdad4",
                    "tertiary-fixed": "#bce9ff",
                    "on-primary-fixed-variant": "#8f1104",
                    "primary-fixed-dim": "#ffb4a7",
                    "on-secondary-fixed-variant": "#3e4c16",
                    "surface": "#fff8f6",
                    "on-primary-fixed": "#400200",
                    "surface-container-highest": "#f7ddd8"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "gutter": "24px",
                    "stack-xl": "48px",
                    "stack-xs": "8px",
                    "unit": "4px",
                    "margin-desktop": "64px",
                    "margin-mobile": "20px",
                    "stack-md": "24px"
            },
            "fontFamily": {
                    "display-lg": ["Noto Serif"],
                    "body-md": ["Be Vietnam Pro"],
                    "display-lg-mobile": ["Noto Serif"],

                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],

                    "label-sm": ["13px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }

      body {
        background-color: #fbf9f4; /* Rice Paper Base */
        color: #261816; /* Deep Ink */
      }

      .rice-paper-texture {
        background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        opacity: 0.05;
      }

      .caligraphy-grid {
        background-image: radial-gradient(#e5e2da 1px, transparent 1px);
        background-size: 24px 24px;
      }

      .loading-spin {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .focus-ink:focus {
        outline: none;
        border-bottom: 2px solid #261816;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-body-md min-h-screen flex flex-col items-center justify-center relative">
<!-- Texture Overlays -->
<div class="fixed inset-0 rice-paper-texture pointer-events-none"></div>
<main class="w-full max-w-md px-margin-mobile py-stack-xl relative z-10 flex flex-col min-h-screen md:min-h-0 md:justify-center">
<!-- Brand Identity / Top AppBar Contextual -->
<div class="flex flex-col items-center mb-stack-xl text-center">
<div class="w-16 h-16 bg-primary-container text-on-primary rounded-xl flex items-center justify-center mb-6 shadow-sm border border-outline-variant">
<span class="material-symbols-outlined text-4xl" data-icon="menu_book">menu_book</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile mb-4 text-on-surface tracking-tight">
                Học tiếng Nhật, Trung, Hàn cùng Ideogram
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] leading-relaxed">
                Nhập email để nhận liên kết đăng nhập
            </p>
</div>
<!-- Sign-in Form -->
<section class="flex flex-col gap-stack-md w-full">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant" for="email">
                    Địa chỉ email
                </label>
<div class="relative group">
<input class="w-full h-[52px] bg-white border border-outline-variant rounded-lg px-4 font-body-md text-on-surface focus:ring-0 focus:border-on-surface transition-all duration-150 placeholder:text-outline" id="email" name="email" placeholder="name@example.com" type="email"/>
</div>
<!-- Validation/Error State Placeholder (Hidden by default) -->
<p class="hidden text-error font-label-sm text-label-sm mt-1 flex items-center gap-1" id="email-error">
<span class="material-symbols-outlined text-[16px]" data-icon="error">error</span>
                    Vui lòng nhập địa chỉ email hợp lệ.
                </p>
</div>
<!-- Primary CTA -->
<button class="w-full h-[52px] bg-[#d94833] text-white rounded-lg font-medium text-body-lg flex items-center justify-center transition-all duration-150 hover:bg-[#ae2918] active:scale-[0.98] shadow-sm" id="submit-btn">
                Gửi liên kết an toàn
            </button>
<!-- Loading/Disabled State Demo (Toggled via JS or shown for static view) -->
<div class="mt-4 pt-4 border-t border-outline-variant/30">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-3 italic opacity-60">Trạng thái xử lý (Ví dụ):</p>
<button class="w-full h-[52px] bg-secondary-container text-on-secondary-container rounded-lg font-medium text-body-lg flex items-center justify-center opacity-70 cursor-not-allowed" disabled="">
<span class="material-symbols-outlined loading-spin mr-2" data-icon="progress_activity">progress_activity</span>
                    Đang gửi...
                </button>
</div>
</section>
<!-- Footer / Privacy -->
<footer class="mt-auto md:mt-stack-xl pt-stack-md text-center">
<div class="flex justify-center gap-4 mb-6">
<div class="caligraphy-grid w-10 h-10 border border-outline-variant rounded flex items-center justify-center text-on-surface-variant">日</div>
<div class="caligraphy-grid w-10 h-10 border border-outline-variant rounded flex items-center justify-center text-on-surface-variant">语</div>
<div class="caligraphy-grid w-10 h-10 border border-outline-variant rounded flex items-center justify-center text-on-surface-variant">한</div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed px-4">
                Thông tin của bạn được bảo mật theo <a class="underline hover:text-primary" href="#">chính sách quyền riêng tư</a>.
            </p>
</footer>
</main>
<!-- Background Decorative Elements -->
<div class="hidden lg:block absolute top-12 left-12 opacity-10 rotate-[-12deg]">
<img class="w-64 h-64 object-contain" data-alt="A macro photograph of high-quality sumi-e ink texture on rough, handmade rice paper. The lighting is soft and directional, emphasizing the tactile fibers of the paper. Deep blacks transition into subtle charcoal greys against a warm, creamy off-white background. The mood is scholarly and quiet." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCGBtXu6qBx_kMzg31YvM8UoDcJ49ZZC9vRM2pVh2TZPybaS-YNVFWEf2-cZiXDFTkkFO54W15nYgwN7Enyz3fo0SPkewu5A-61MRzg029mUDL5GvBqT4s22jFwl5X_in2RtwcW9Zy8WY3XqrQbR8ZmFdgZyL2RcU7xAYnzbNaj2orlNK-m6kM9i3PO7EFRATFiJXMqMBzrdb7VZAkDJ5FKMr0mzpF2VwAJknokGr3LOzOK-r7zaFJpxN6KWGO4FXgWJmBkZFHOu0M"/>
</div>
<div class="hidden lg:block absolute bottom-12 right-12 opacity-10 rotate-[8deg]">
<img class="w-64 h-64 object-contain" data-alt="A minimalist overhead shot of a traditional bamboo calligraphy brush resting on a ceramic ink stone. The scene is bathed in natural daylight, creating soft shadows on a minimalist wooden desk. The color palette features natural wood tones, deep ink black, and ivory whites. Professional, academic, and calm atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuABRl6KtnumxjxCgoeKqfNtsK9aWVXADS4OFwqfuqao2WH8pNI9sCSfl-o1HOCO4ySnQ1KNT2LXYooTn6bh03a_fk6tW1w639cUi3VMqAfjVxaD1DYaAiCKi1hiGCpWEFIGM-l6IV7IU5EgxhQRWvy2HMbhJN09Cm9FgiZxG9B8v8RorxD9mZvEmTZOOpXi99fcOUFqTPOUnV1qGuIGR4pulJVyLWd1IGoHLcXzQhjZsK3sZ7OQltiD8IDVdOk3WAPl6DbwgzBnONk"/>
</div>
<script>
        // Micro-interactions for the input field and validation
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('email-error');

        emailInput.addEventListener('input', (e) => {
            const val = e.target.value;
            // Simple validation simulation
            if (val.length > 0 && !val.includes('@')) {
                errorMsg.classList.remove('hidden');
                emailInput.classList.add('border-error');
                emailInput.classList.remove('border-outline-variant');
            } else {
                errorMsg.classList.add('hidden');
                emailInput.classList.remove('border-error');
                emailInput.classList.add('border-outline-variant');
            }
        });

        submitBtn.addEventListener('click', () => {
            if (emailInput.value.includes('@')) {
                submitBtn.innerHTML = `<span class="material-symbols-outlined loading-spin mr-2">progress_activity</span> Đang gửi...`;
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-70');

                // Simulate success after 1.5s
                setTimeout(() => {
                    submitBtn.innerHTML = `<span class="material-symbols-outlined mr-2">check_circle</span> Đã gửi thành công`;
                    submitBtn.classList.remove('bg-[#d94833]');
                    submitBtn.classList.add('bg-secondary');
                }, 1500);
            } else {
                errorMsg.classList.remove('hidden');
                emailInput.focus();
            }
        });
    </script>
</body></html>
